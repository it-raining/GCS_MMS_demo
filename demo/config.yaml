# =============================================================================
# Configuration for GCS-MMS Motion Planning Demo
# =============================================================================
# This demo implements a hybrid discrete-continuous motion planning framework:
# - Discrete path selection on graph of convex sets (GCS-style)
# - Continuous trajectory optimization via direct multiple shooting
# - On/off convex geometry with Big-M encoding (approximating perspective)
# - Explicit discrete-continuous coupling
#
# Classification: MIOCP (continuous-time) -> MINLP (after transcription)
# =============================================================================

# -----------------------------------------------------------------------------
# Problem Preset
# -----------------------------------------------------------------------------
problem:
  # Geometry presets are registered in problem_data.py
  default_preset: "maze"

# -----------------------------------------------------------------------------
# Start and Goal States
# -----------------------------------------------------------------------------
# State format: [px, py, theta] for unicycle model
# Note: theta is heading angle in radians
# These are global defaults and can be overridden per scenario.
start_state:
  position: [0.2, 0.2]
  heading: 0.785  # 45 degrees, pointing toward goal

goal_state:
  position: [4.8, 4.8]
  heading: 0.785  # 45 degrees

# -----------------------------------------------------------------------------
# Dynamics Configuration
# -----------------------------------------------------------------------------
dynamics:
  model: "unicycle"  # Currently only unicycle supported
  
  # State dimension: n_x = 3 (px, py, theta)
  # Control dimension: n_u = 2 (v, omega)
  
  # Control bounds
  v_min: -2.0      # minimum linear velocity
  v_max: 2.0       # maximum linear velocity
  omega_min: -3.14159  # minimum angular velocity (-pi)
  omega_max: 3.14159   # maximum angular velocity (pi)
  
  # Time bounds per region
  delta_min: 0.01  # minimum time in each region
  delta_max: 10.0  # maximum time in each region

# -----------------------------------------------------------------------------
# Control Parameterization
# -----------------------------------------------------------------------------
control:
  # Type of parameterization on each region
  # Options: "constant" (one control per region), "piecewise_constant" (N segments)
  parameterization: "piecewise_constant"
  
  # Number of control segments per region (for piecewise_constant)
  n_segments: 2

# -----------------------------------------------------------------------------
# Multiple Shooting Configuration
# -----------------------------------------------------------------------------
shooting:
  # Number of integration steps for RK4 within each region
  n_integration_steps: 20
  
  # Number of mesh points for safety constraint sampling
  # These are points where we check A_v * x(tau_k) <= b_v - epsilon
  n_mesh_points: 10
  
  # Safety margin epsilon for region containment
  safety_margin: 0.01

  # Optional control barrier function safety layer for fixed-path polishing.
  # Set to 0.0 to disable and use mesh containment only.
  cbf_alpha: 0.0

# -----------------------------------------------------------------------------
# Region Decomposition Configuration
# -----------------------------------------------------------------------------
# ACD2D decomposes the workspace into edge-touching convex polygons.
# Each polygon is expanded outward by overlap_width (Shapely mitre buffer +
# workspace clip) so adjacent regions overlap by 2*overlap_width at shared edges.
#
# Hard constraint: overlap_width >= centroid_refine_dms.delta_safe + delta_extra
# Legacy and two_stage solvers are unaffected — extra feasible space at interfaces.
region_decomposition:
  overlap_width: 0.25

# -----------------------------------------------------------------------------
# Cost Function Weights
# -----------------------------------------------------------------------------
# Total cost: sum_v rho_v where
# rho_v >= J_v = a * Delta_v
#            + integral[w_L * ||q_dot||^2 + w_E * ||u||^2] dtau
#            + w_u_smooth * sum_k ||u_{k+1} - u_k||^2
cost:
  # Time penalty weight (penalizes total trajectory duration)
  a: 1.0
  
  # Velocity/path length penalty weight
  w_L: 1.0
  
  # Control effort penalty weight
  w_E: 1.0

  # Penalize abrupt control changes between neighboring control segments.
  # Larger values make turns and accelerations smoother, but can increase time.
  w_u_smooth: 0.5

  # Optional soft heading smoothness term across fixed-path interfaces.
  w_theta_smooth: 0.0
# -----------------------------------------------------------------------------
# Optimizer Configuration
# -----------------------------------------------------------------------------
optimizer:
  # Safety limit for graph-path counting in experiment summaries
  max_paths: 1500

  # Enforce u_left(1) = u_right(0) across active region transitions.
  # This makes the final control profile continuous across interfaces, but
  # does not by itself eliminate the need for path polish when the integrated
  # discrete relaxation remains fractional.
  enforce_control_continuity: true
  
  # Solver verbosity/options for the integrated continuous relaxation solve
  ipopt:
    max_iter: 3500
    tol: 1.0e-6
    print_level: 0  # 0=silent, 5=verbose
    
  # Solver mode
  # "integrated_relaxation_legacy" : one-phase Big-M MIOCP relaxation (IPOPT)
  # "two_stage"                    : heuristic path selection + fixed-path NLP
  # "centroid_refine_dms"          : Chebyshev-center graph search + interface QP + barrier DMS
  solver_mode: "integrated_relaxation_legacy"

  # Big-M values for on/off constraints (used only by integrated_relaxation_legacy)
  big_M:
    position: 20.0    # for state bounds
    interface: 20.0   # for coupling constraints
    time: 100.0       # UNUSED: declared for backward compat; no constraint builder reads it

# -----------------------------------------------------------------------------
# Centroid-Refine-DMS Solver Configuration
# (used when optimizer.solver_mode == "centroid_refine_dms")
# -----------------------------------------------------------------------------
centroid_refine_dms:
  # Graph search
  gamma_w: 1.0          # interface clearance bonus (same units as dist)
  gamma_h: 0.64         # turn penalty weight = v_nom/omega_max ≈ 2/pi

  # Geometric QP
  alpha_s: 0.0          # smoothness weight (0 = pure shortest polyline)
  delta_extra: 0.01     # strict-interior margin (= delta_safe / 2)

  # Warm-start
  v_nom_fraction: 0.5   # v_nom = v_nom_fraction * (v_max + |v_min|) / 2

  # Barrier schedule (Fiacco-McCormick / Wright 1997)
  alpha_mu: 0.1         # mu_0 = alpha_mu * f0 / B0
  tau: 0.1              # barrier reduction factor
  mu_min: 1.0e-5        # from KKT complementarity: eps_KKT * delta_extra

  # NLP settings
  n_int: 20             # RK4 integration steps per segment
  delta_min: 0.01
  delta_max: 10.0

  # Cost weights
  w_T: 1.0
  w_L: 1.0
  w_U: 1.0
  w_S: 0.2

  # Stopping criteria
  epsilon_final: 1.0e-6
  epsilon_gap: 0.05
  time_limit_s: 60.0

  # Solver mode
  mode: "first_feasible"

  # Ablation flags (all true = full method)
  use_centroid_cost: true
  use_interface_qp: true
  use_log_barrier: false
  use_barrier_continuation: true
  use_inexact_tolerance: true

# -----------------------------------------------------------------------------
# Visualization Configuration
# -----------------------------------------------------------------------------
visualization:
  # Figure size (inches)
  figsize: [10, 10]
  
  # Colors
  colors:
    workspace: "#f0f0f0"
    obstacles: "#000000"
    regions: "tab10"  # colormap name
    trajectory: "#2196F3"
    start: "#4CAF50"
    goal: "#F44336"
    interface_points: "#FF9800"
    mesh_points: "#9C27B0"
  
  # Whether to show mesh points on trajectory
  show_mesh_points: true
  
  # Animation settings
  animation:
    fps: 30
    shooting_fps: 12
    duration: 5.0  # seconds

# -----------------------------------------------------------------------------
# Experiment Scenarios
# -----------------------------------------------------------------------------
scenarios:
  # Scenario-specific parameter changes should go under `overrides`.
  # Supported examples:
  #   overrides.shooting.n_mesh_points
  #   overrides.control.n_segments
  #   overrides.cost.a
  #   overrides.optimizer.ipopt.max_iter
  # You can also override `problem_preset`, `start_state`, and `goal_state`.
    
  default:
    name: "Default Environment"
    description: "Default map with hand-crafted convex safe regions"
    active_regions: "all"
    problem_preset: "default"
    overrides:
      shooting:
        n_mesh_points: 7
    
  crd_demo:
    name: "CRD Demo — Overlapping Corridor"
    description: "5 overlapping rectangular regions; lightweight first-feasible CRD demo"
    active_regions: "all"
    problem_preset: "crd_demo"
    overrides:
      optimizer:
        solver_mode: "centroid_refine_dms"
      centroid_refine_dms:
        n_int: 10
        n_ctrl_per_seg: 2  # was 1; 2 needed for tight corridors (arc r = v/omega must fit)
        time_limit_s: 30.0
        delta_safe: 0.03
        delta_extra: 0.01
        w_S: 0.1
        # use_log_barrier: true

  default_crd:
    name: "Default — Centroid-Refine-DMS"
    description: "Default 5x5 workspace using CentroidRefineDMS (lightweight demo config)"
    active_regions: "all"
    problem_preset: "default"
    overrides:
      optimizer:
        solver_mode: "centroid_refine_dms"
      centroid_refine_dms:
        n_int: 10          # lighter: 10 RK4 steps (20 is default)
        n_ctrl_per_seg: 2  # 2 piecewise-constant controls per segment
        time_limit_s: 30.0
        w_S: 0.1
        use_log_barrier: false  # barrier + explicit constraints double-count; pending rework

  maze_crd:
    name: "Maze — Centroid-Refine-DMS"
    description: "Maze preset with CentroidRefineDMS solver"
    active_regions: "all"
    problem_preset: "maze"
    start_state:
      position: [0.4, 2.0]
      heading: 0.0
    goal_state:
      position: [4.8, 4.8]
      heading: 0.785
    overrides:
      optimizer:
        solver_mode: "centroid_refine_dms"
      centroid_refine_dms:
        n_int: 10
        time_limit_s: 120.0
        delta_max: 8.0
        w_S: 0.1

  maze_15_crd:
    name: "Maze 15×15 — CRD Zigzag Corridor"
    description: "8-region zigzag in a 15×15 workspace; lightweight first-feasible CRD demo"
    active_regions: "all"
    problem_preset: "maze_15"
    start_state:
      position: [1.0, 1.0]
      heading: 0.0
    goal_state:
      position: [1.0, 14.0]
      heading: 1.5708
    overrides:
      optimizer:
        solver_mode: "centroid_refine_dms"
      centroid_refine_dms:
        n_int: 10
        time_limit_s: 60.0
        delta_safe: 0.02
        delta_extra: 0.01
        delta_max: 20.0
        w_S: 0.1
        use_log_barrier: true

  maze:
    name: "Maze Environment"
    description: "Maze map with all active regions"
    active_regions: "all"
    problem_preset: "maze"
    overrides:
      shooting:
        # The maze decomposition often creates narrow passages and sliver
        # interface regions. Three mesh points only checks one interior sample
        # per region, which is too sparse for curved unicycle trajectories.
        n_mesh_points: 3
      control:
        # Two piecewise-constant segments per region are often too coarse for
        # the maze ACD decomposition, especially around tiny bridge regions.
        n_segments: 4
      optimizer:
        # Exact control continuity across every region interface makes the
        # unicycle start turning too early and keep turning too long when the
        # graph contains narrow/sliver transitions.
        enforce_control_continuity: false

# -----------------------------------------------------------------------------
# Output Configuration
# -----------------------------------------------------------------------------
output:
  # Directory for results (relative to demo folder)
  results_dir: "results"

  # Directory for Markdown reports (relative to repo root)
  docs_dir: "docs"

  # File formats
  save_png: true
  save_gif: true
  save_json: true  # save numeric results
  save_md: true    # save Markdown reports to docs/

  # Verbosity level (0=quiet, 1=normal, 2=verbose)
  verbosity: 1
