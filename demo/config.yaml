# =============================================================================
# Configuration for GCS-MMS Motion Planning Demo
# =============================================================================
# Primary solver: centroid_refine_dms (CRD)
# All legacy IntegratedMIOCPSolver / two_stage options have been removed.
# =============================================================================

# -----------------------------------------------------------------------------
# Problem Preset
# -----------------------------------------------------------------------------
problem:
  # Fallback preset when a scenario does not declare problem_preset.
  default_preset: "default"

# -----------------------------------------------------------------------------
# Region Decomposition
# -----------------------------------------------------------------------------
# Each ACD2D polygon is expanded outward by overlap_width (Shapely mitre buffer
# + workspace clip). Two adjacent regions share an overlap band of width
# 2*overlap_width. Must satisfy: overlap_width >= delta_safe + delta_extra.
region_decomposition:
  overlap_width: 0.5

# -----------------------------------------------------------------------------
# Start and Goal States  (global defaults; overridable per scenario)
# -----------------------------------------------------------------------------
# State format: [px, py, theta]  (theta in radians)
start_state:
  position: [0.2, 0.2]
  heading: 0.785   # 45 degrees

goal_state:
  position: [4.8, 4.8]
  heading: 0.785

# -----------------------------------------------------------------------------
# Dynamics
# -----------------------------------------------------------------------------
dynamics:
  model: "unicycle"
  v_min: -2.0
  v_max: 2.0
  omega_min: -3.14159   # -pi
  omega_max:  3.14159   #  pi
  # omega_min: -1.5707      # -pi/2 (tighter heading-change penalty in graph search heuristic)
  # omega_max: 1.5707       #  pi/2
  delta_min: 0.1        # minimum dwell time per region [s]
  delta_max: 3.0        # bounds h_max for the Lipschitz safety certificate [s]

# -----------------------------------------------------------------------------
# Control Parameterization
# -----------------------------------------------------------------------------
control:
  parameterization: "piecewise_constant"
  n_segments: 2   # piecewise-constant segments per region

# -----------------------------------------------------------------------------
# Multiple Shooting
# -----------------------------------------------------------------------------
shooting:
  # RK4 integration steps per region (used by CRD as n_int).
  # Larger n_int reduces the Lipschitz gap and improves safety certification,
  # at the cost of a larger NLP.
  n_integration_steps: 10

# -----------------------------------------------------------------------------
# Cost Function
# -----------------------------------------------------------------------------
# CRD cost per region: w_T*Delta + integral(w_L*||q_dot||^2 + w_U*||u||^2)dtau
#                    + w_S * sum_k ||u_{k+1} - u_k||^2
cost:
  a: 1.0          # time penalty (w_T)
  w_L: 1.0        # path-length penalty
  w_E: 1.0        # control-effort penalty (w_U)
  w_u_smooth: 0.5 # inter-segment control smoothness (w_S)

# -----------------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------------
optimizer:
  solver_mode: "centroid_refine_dms"

  # Upper bound on path enumeration used in experiment summaries.
  max_paths: 1500

# -----------------------------------------------------------------------------
# Centroid-Refine-DMS Solver
# -----------------------------------------------------------------------------
# Math reference: docs/superpowers/specs/2026-06-07-centroid-refine-dms-design.md
# Pipeline:
#   A. Heuristic graph search  -> ranked candidate paths
#   B. Interface QP            -> waypoints with safe overlap clearance
#   C. Centroid warm-start     -> feasible DMS initial guess
#   D-E. Barrier DMS           -> trajectory with log-barrier safety
centroid_refine_dms:
  # Stage A -- graph search heuristic weights
  gamma_w: 1.0    # interface clearance bonus (same units as length)
  gamma_h: 0.64   # heading-change penalty (v_nom / omega_max ~= 2.0/pi)

  # Stage B -- Interface QP safety margins
  delta_safe: 0.02
  # delta_extra is a HARD lower bound on the safety slack inside the
  # barrier-DMS NLP (not just a warm-start sanity threshold): raising it
  # directly raises the guaranteed certified_safety_margin. It also still
  # affects Interface QP anchor-point clearance.
  delta_extra: 0.01
  # Extra certified-margin headroom, added only to the NLP's safety-slack
  # floor and the certified_safety_margin pass/fail threshold. Does NOT
  # affect Interface QP/path-search behavior (unlike delta_safe/delta_extra).
  # Raise this per-scenario if safety_certification reports NOT_CERTIFIED
  # with a thin margin.
  epsilon_certificate_buffer: 0.0
  alpha_s: 0.0    # QP smoothness weight (0 = pure shortest polyline)

  # Stage C -- warm-start nominal speed
  v_nom_fraction: 0.5   # v_nom = fraction * v_max

  # Stage D-E -- barrier continuation schedule (large -> small mu)
  barrier_levels: [1.0, 0.5, 0.1, 0.01, ]

  # Stopping criteria
  epsilon_final: 1.0e-6   # final IPOPT KKT tolerance
  epsilon_gap: 0.05        # near-optimality gap for anytime mode
  # time_limit_s: 60.0

  mode: "anytime"   # "first_feasible" | "anytime"

  # Ablation flags (all true = full proposed method)
  use_centroid_cost: true
  use_interface_qp: true
  use_log_barrier: true
  use_barrier_continuation: true
  use_inexact_tolerance: true

# -----------------------------------------------------------------------------
# Visualization
# -----------------------------------------------------------------------------
visualization:
  figsize: [10, 10]
  colors:
    workspace: "#f0f0f0"
    obstacles: "#000000"
    regions: "tab10"
    trajectory: "#2196F3"
    start: "#4CAF50"
    goal: "#F44336"
    interface_points: "#FF9800"
    mesh_points: "#9C27B0"
  show_mesh_points: true
  animation:
    fps: 30
    shooting_fps: 12
    duration: 5.0

# -----------------------------------------------------------------------------
# Scenarios
# -----------------------------------------------------------------------------
# Overrides are merged on top of the global config via deep-update.
# CRD-relevant override keys:
#   overrides.centroid_refine_dms.*          -- solver hyperparameters
#   overrides.control.n_segments             -- piecewise-constant segments
#   overrides.shooting.n_integration_steps   -- RK4 steps (affects Lipschitz gap)
#   overrides.dynamics.delta_max             -- max dwell time per region
#   overrides.cost.*                         -- cost weights
#   overrides.region_decomposition.overlap_width
scenarios:
  default:
    name: "Default Environment"
    description: "5x5 workspace with 6 obstacles, ACD2D convex decomposition"
    active_regions: "all"
    problem_preset: "default"
    overrides:
      control:
        n_segments: 4
      shooting:
        n_integration_steps: 44
      centroid_refine_dms:
        delta_safe: 0.02
        barrier_levels: [0.05]
        mode: "first_feasible"

  maze:
    name: "Maze Environment"
    description: "Dense maze obstacle field, ACD2D convex decomposition"
    active_regions: "all"
    problem_preset: "maze"
    overrides:
      # Dense maze regions are small (~0.15-0.3 units across) and many
      # interfaces have Chebyshev radius as low as 0.13. The global
      # n_integration_steps=10 / delta_max=3.0 give h_max=0.3, which under
      # R13 (delta_safe >= L_s*h_max/2 + eps) auto-raises delta_safe to
      # ~0.30 -- larger than nearly every interface in the maze, so the
      # Interface QP narrow-interface check (Part 3.4) rejects almost all
      # candidate paths. h_max = delta_max/n_int, so shrinking delta_max
      # (keeping n_int at the default 10, to avoid blowing up the NLP size
      # for 30+ region maze paths) brings h_max to ~0.04, keeping required
      # delta_safe (~0.05 incl. delta_extra) below all but a dozen
      # genuinely narrow interfaces.
      dynamics:
        delta_max: 0.4
      centroid_refine_dms:
        mode: "first_feasible"
        time_limit_s: 120.0
        # Default gamma_w=1.0 barely penalizes narrow interfaces, so Yen's
        # k-shortest search (Stage A, Part 3.3) exhausts hundreds of
        # cheap-but-narrow variants of the same corridor before trying a
        # genuinely wide one -- confirmed by 128 evaluated candidates all
        # sharing the same node prefix/suffix, none reaching Stage D-E.
        # The maze is still connected after removing every edge with
        # Chebyshev radius < 0.10 (same 34-node shortest path length), so a
        # clear route exists; raising gamma_w (Part 3.2 composite edge cost)
        # ranks it higher in the search order.
        gamma_w: 8.0
        # Small headroom above the QP-guaranteed margin: the osqp/qpsol
        # interface QP satisfies its delta_safe+delta_extra constraint only
        # to solver tolerance (observed shortfall ~0.0015-0.002 regardless
        # of delta_extra, consistent with a fixed numerical tolerance
        # floor rather than a proportional effect), so the R3
        # strict-interior check at the exact interface node can come up a
        # hair short. 0.04 leaves clear headroom above that floor.
        delta_extra: 0.05

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  results_dir: "results"
  # Directory for Markdown reports (relative to repo root)
  docs_dir: "docs"
  save_png: true
  save_gif: true
  save_json: true
  verbosity: 1
